name: Publish beta release
on:
  workflow_dispatch:
  push:
    paths:
      - custom_components/peplink_incontrol2/manifest.json
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Python syntax
        run: python -m compileall -q custom_components
      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@master
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
      - name: Verify version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json;print(json.load(open("custom_components/peplink_incontrol2/manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -n "$VERSION"
          test -f hacs.json
          test -f custom_components/peplink_incontrol2/brand/icon.png
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"; exit 1
          fi
      - name: Publish beta on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "Peplink InControl 2 Monitor v$VERSION" --notes "Beta update: corrected historical API date filters; discovered interface/WAN identifiers; per-WAN state and history; GPS speed and altitude; client count. Signal and survey samples require live confirmation. No secrets or device-specific values included."
