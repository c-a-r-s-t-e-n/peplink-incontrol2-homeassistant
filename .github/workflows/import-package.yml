name: Import initial HACS integration
on:
  push:
    paths:
      - .github/workflows/import-package.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand reviewed integration package and remove archive
        shell: bash
        run: |
          set -euo pipefail
          test -f peplink_incontrol2_github_ready.zip
          unzip -o peplink_incontrol2_github_ready.zip -d .
          rm -f peplink_incontrol2_github_ready.zip
          # Workflow creation requires separate GitHub workflow permission.
          rm -f .github/workflows/validate.yml
          rm -f .github/workflows/import-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish HACS-compatible Peplink InControl 2 beta source"
          git push
