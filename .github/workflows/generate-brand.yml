name: Generate original brand icon
on:
  push:
    paths:
      - .github/workflows/generate-brand.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Build PNG from original vector shapes
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          im = Image.new("RGBA", (256, 256))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((8, 8, 248, 248), radius=53, fill="#112234")
          d.arc((49,54,211,218), 205, 335, fill="#37cab9", width=13)
          d.arc((70,74,190,194), 205, 335, fill="#37cab9", width=9)
          d.ellipse((112,110,144,142), fill="white")
          d.line((128,126,128,193), fill="white", width=13)
          d.rounded_rectangle((105,188,151,203), radius=7, fill="white")
          output = Path("custom_components/peplink_incontrol2/brand/icon.png")
          output.parent.mkdir(parents=True, exist_ok=True)
          im.save(output, optimize=True)
          PY
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/peplink_incontrol2/brand/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: generate valid original integration icon"
            git push
          fi
